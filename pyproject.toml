[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-usage"
dynamic = ["version"]
description = "CLI tool to track Antigravity CLI model usage, per-session tokens, cached tokens, and GitHub-style heatmaps."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Antigravity User" }]
keywords = ["antigravity", "gemini", "tokens", "usage", "cli", "heatmap", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
agy-usage = "agy_usage.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agy_usage*"]

[tool.setuptools.dynamic]
version = {attr = "agy_usage.__version__"}
